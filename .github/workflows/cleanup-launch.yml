name: Launch clean-up

# One-off, owner-approved clean-up before the App Store submission (see
# scripts/cleanup-launch.mjs). A dry run unless APPLY is '1'.
on:
  push:
    branches: [claude/girl-loading-intro]
    paths: ['scripts/cleanup-launch.mjs', '.github/workflows/cleanup-launch.yml']

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cleanup-launch.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLY: '1'
          # The nine accounts of the census of 2026-10-22, approved by the owner (all but appreview@getirly.com).
          ACCOUNT_IDS: 'bd526ae0-55f1-4cef-b6d6-8056c6a2959f,3698911d-efb5-4111-a0d1-4adcee360c8b,1d108e68-3a40-40ad-afce-b2287ec39d49,3977d13c-4f68-42c2-af58-3d3630be3d6b,8dd9eb38-7aff-4165-aac6-ea732dda65ba,e2521925-34a2-4b17-b55e-779a00b9e801,0f680c2b-8488-45d6-97bd-b9b3842e4d35,7ee00b91-9d00-452c-8a62-757f0aa604a2,67d42e8b-2a8c-425e-bd5f-8b0a6f2786a7'
