name: Launch clean-up

# One-off, owner-approved clean-up before the App Store submission (see
# scripts/cleanup-launch.mjs). A dry run unless APPLY is '1'.
on:
  push:
    branches: [claude/girl-loading-intro]
    paths: ['scripts/cleanup-launch.mjs', '.github/workflows/cleanup-launch.yml']

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cleanup-launch.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Applied once on 2026-10-22 (run 39820107931) to the nine accounts the owner confirmed; a dry run since.
          APPLY: '0'
          ACCOUNT_IDS: ''
