name: Community census

# Read-only: lists communities, their parent and real member counts (no
# member identities), so changes to the hierarchy start from the facts.
# Manual runs from main only. Logs of this public repository are public.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/community-census.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
