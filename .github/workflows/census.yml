name: Community census

# Read-only: lists communities, their parent and real member counts (no
# member identities), so changes to the hierarchy start from the facts.
on:
  workflow_dispatch:
  push:
    branches: [claude/confident-ride-1o2o3x]
    paths: ['scripts/community-census.mjs', '.github/workflows/census.yml']

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/community-census.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
