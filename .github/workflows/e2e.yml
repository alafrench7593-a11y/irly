name: E2E

# Walks every user journey against the live IRLY Supabase project with
# throwaway accounts (deleted at the end), then loads the web app in a real
# browser signed in as a test member. Needs SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:
  push:
    branches: [claude/confident-ride-1o2o3x]
    paths:
      - 'scripts/e2e.mjs'
      - 'scripts/e2e-ui.mjs'
      - 'scripts/e2e-sync.mjs'
      - 'scripts/e2e-girl.mjs'
      - 'scripts/e2e-activities.mjs'
      - 'scripts/e2e-cms.mjs'
      - 'scripts/check-routes.mjs'
      - 'src/**'
      - '.github/workflows/e2e.yml'
  workflow_run:
    workflows: [Database]
    types: [completed]
    branches: [claude/confident-ride-1o2o3x]

permissions:
  contents: read
  actions: read

jobs:
  # A push that changes the database must not be tested before its migrations
  # are deployed (it once tested the old schema and passed). Holds no
  # concurrency slot, so it can wait for the Database run without deadlock.
  wait-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Wait for this commit's database deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Same paths as the push filter of supabase.yml (keep in sync).
          DB_PATHS='^(supabase/|scripts/deploy-db\.mjs$|scripts/test-db\.sh$|scripts/check-(intent|network|bali|community|areas)\.mts$|src/features/(network|ai|community)/|src/features/bali/fit\.ts$|scripts/place-tags\.mjs$|src/data/destinations\.ts$|\.github/workflows/supabase\.yml$)'
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$SHA")
          else
            changed=$(git show --name-only --format= "$SHA")
          fi
          if ! grep -qE "$DB_PATHS" <<<"$changed"; then echo "No database change in this push."; exit 0; fi
          echo "Database change in this push: waiting for the Database run of $SHA."
          for i in $(seq 1 85); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/supabase.yml/runs?head_sha=$SHA&per_page=1" \
                  --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            echo "  $run"
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Database run for $SHA did not succeed ($run): E2E would test the old schema."; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for the Database run"; exit 1

  api:
    needs: wait-db
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Bounded well under the 2-hour sweep of abandoned test accounts: a run still going is never swept.
    timeout-minutes: 60
    # E2E runs never overlap each other (they share throwaway accounts).
    concurrency:
      group: irly-e2e-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # After a deploy: test exactly the commit Database deployed, not the branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Journeys against the live backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/e2e.mjs
      - name: Activities in communities and chats (live cards, activity chats, IRLY Girl)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/e2e-activities.mjs
      - name: Editorial back office (news, Home layout, banners; IRLY and IRLY Girl)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/e2e-cms.mjs 2>&1 | tee cms.log; a=${PIPESTATUS[0]}
          grep -E '^ℹ pg_cron' cms.log | while IFS= read -r l; do echo "::notice title=pg_cron::$l"; done
          exit $a

  ui:
    needs: [wait-db, api]
    if: always() && needs.wait-db.result == 'success' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same group as api: no two E2E jobs run at once, across runs (their test
    # accounts and cleanups must never overlap another run's).
    concurrency:
      group: irly-e2e-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every in-app link opens a real screen
        run: node scripts/check-routes.mjs
      - name: Build the web app
        run: npx expo export --platform web --output-dir dist
      - name: Install Chromium
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; npx -y playwright@1.56.1 install --with-deps chromium
      - name: Real browser, real backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm i --no-save playwright@1.56.1
          set +e
          node scripts/e2e-ui.mjs 2>&1 | tee ui.log; a=${PIPESTATUS[0]}
          echo; echo '── Paths, errors, synchronisation ──'
          node scripts/e2e-sync.mjs 2>&1 | tee sync.log; b=${PIPESTATUS[0]}
          echo; echo '── IRLY Girl, as a new member ──'
          node scripts/e2e-girl.mjs 2>&1 | tee girl.log; c=${PIPESTATUS[0]}
          # Each failed step and each suite's total as an annotation on the run, readable without the full log.
          for f in ui sync girl; do
            grep -E '^(✗|   url:|   screen:)' $f.log | head -30 | while IFS= read -r l; do echo "::warning title=$f::${l:0:900}"; done
            echo "::notice title=$f::$(grep -E '^[0-9]+ passed' $f.log | tail -1)"
          done
          exit $(( a || b || c ))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e-shots/
