name: E2E

# Walks every user journey against the live IRLY Supabase project with
# throwaway accounts (deleted at the end), then loads the web app in a real
# browser signed in as a test member. Needs SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:
  push:
    branches: [claude/confident-ride-1o2o3x]
    paths:
      - 'scripts/e2e.mjs'
      - 'scripts/e2e-ui.mjs'
      - 'scripts/e2e-sync.mjs'
      - 'scripts/check-routes.mjs'
      - 'src/**'
      - '.github/workflows/e2e.yml'
  workflow_run:
    workflows: [Database]
    types: [completed]
    branches: [claude/confident-ride-1o2o3x]

concurrency:
  group: irly-backend
  cancel-in-progress: false

jobs:
  api:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Journeys against the live backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/e2e.mjs

  ui:
    needs: api
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every in-app link opens a real screen
        run: node scripts/check-routes.mjs
      - name: Build the web app
        run: npx expo export --platform web --output-dir dist
      - name: Install Chromium
        run: npx -y playwright@1.56.1 install --with-deps chromium
      - name: Real browser, real backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm i --no-save playwright@1.56.1
          set +e
          node scripts/e2e-ui.mjs; a=$?
          echo; echo '── Paths, errors, synchronisation ──'
          node scripts/e2e-sync.mjs; b=$?
          exit $(( a || b ))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e-shots/
