name: Health

# Every morning (Dubai time): app crashes of the last 24 hours and the age of
# the newest database backup (scripts/health-check.mjs, read only). A red run
# means something needs a look: GitHub emails it to the repository's owner.
# Needs the SUPABASE_ACCESS_TOKEN secret (the database deploy's).

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/health-check.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crashes and backups
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/health-check.mjs
