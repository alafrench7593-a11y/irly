name: Apple build status

# Reads where the latest iOS builds stand at Apple (processing, TestFlight).
# Read only. Uses the App Store Connect key already in the secrets.

on:
  workflow_dispatch:
    inputs:
      add_team_testers:
        description: Add the team's App Store Connect users as internal TestFlight testers
        type: boolean
        default: false
      invite_email:
        description: Invite this address to the App Store Connect team (Developer role)
        type: string
        default: ''

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: printf '%s' "${{ secrets.ASC_KEY_P8 }}" > asc-api-key.p8
      - run: node .github/scripts/asc-builds.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ADD_TEAM_TESTERS: ${{ inputs.add_team_testers && '1' || '0' }}
          INVITE_EMAIL: ${{ inputs.invite_email }}
