name: Apple build status

# Reads where the latest iOS builds stand at Apple (processing, TestFlight).
# Read only. Uses the App Store Connect key already in the secrets.

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: printf '%s' "${{ secrets.ASC_KEY_P8 }}" > asc-api-key.p8
      - run: node .github/scripts/asc-builds.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
