name: Film screens

# Real captures of the app (real photos, real network) for the IRLY launch
# film. Runs on pushes to film/screens and commits the images back there.

on:
  push:
    branches: [film/screens]
    paths: ['.github/scripts/film-screens.mjs', '.github/workflows/film-screens.yml']

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx expo export --platform web --output-dir dist
      - run: npx -y playwright@1.56.1 install --with-deps chromium
      - run: npm i --no-save playwright@1.56.1
      - name: Shoot
        run: |
          nohup node .github/scripts/web-serve.mjs > web.log 2>&1 &
          sleep 3
          node .github/scripts/film-screens.mjs
      - name: Commit the captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add film-screens
          git commit -m "Film screens: real captures of the app" || echo "no change"
          git push
