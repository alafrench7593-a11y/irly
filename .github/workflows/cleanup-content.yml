name: Content clean-up

# One-off, owner-approved clean-up of test content (see
# scripts/cleanup-content.mjs). A dry run unless APPLY is '1'.
on:
  push:
    branches: [claude/confident-ride-1o2o3x]
    paths: ['scripts/cleanup-content.mjs', '.github/workflows/cleanup-content.yml']

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cleanup-content.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Applied once on 2026-10-24 (run 40132572697); a dry run since.
          APPLY: '0'
