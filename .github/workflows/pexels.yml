name: Dubai photos (Pexels)

# Dubai photos for the app's photo library and the website, and Dubai videos
# for the website, from Pexels. Needs the PEXELS_API_KEY secret (free key:
# https://www.pexels.com/api/). Commits the files and the contact sheets.

on:
  push:
    branches: [claude/confident-ride-1o2o3x]
    paths: ['.github/scripts/pexels*', '.github/workflows/pexels.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pexels
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update >/dev/null && sudo apt-get install -y imagemagick ffmpeg >/dev/null
      - run: node .github/scripts/pexels.mjs
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - name: Commit
        run: |
          git config user.name irly-bot
          git config user.email bot@irly.app
          git add public-photos site/img site/video src/data/pexelsKeys.ts .github/scripts/pexels-picks.json
          git diff --cached --quiet || (git commit -m "Dubai photos and videos from Pexels" && git pull --rebase && git push)
