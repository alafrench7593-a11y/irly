name: Website check

# Checks the live getirly.com (pages, SEO basics, sitemap, the support form
# end to end in a real browser). Run it by hand after a deployment.
# Needs SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; npx -y playwright@1.56.1 install --with-deps chromium
      - name: Check getirly.com
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm i --no-save --ignore-scripts playwright@1.56.1
          node scripts/site-check.mjs
