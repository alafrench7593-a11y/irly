name: Site review

# Captures getirly.com for a design review: the live site and web app (LIVE=1),
# and the newest website on main built and served on the runner (NEXT=1).
# Publishes the frames, metrics and Lighthouse reports on review/getirly[-next].

on:
  push:
    branches: [film/screens]
    paths: ['.github/scripts/site-review.mjs', '.github/workflows/site-review.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  LIVE: '0'
  NEXT: '1'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null
          npm i playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cp $GITHUB_WORKSPACE/.github/scripts/site-review.mjs /tmp/pw/
      - name: Capture getirly.com
        if: env.LIVE == '1'
        run: REVIEW_OUT=$GITHUB_WORKSPACE/review node /tmp/pw/site-review.mjs
      - name: Lighthouse
        if: env.LIVE == '1'
        run: |
          cd /tmp/pw
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          lh() { npx -y lighthouse@12.6.1 "$1" --quiet --output=json --output-path="$GITHUB_WORKSPACE/review/lh-$2.json" --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices,seo ${3:-} || true; }
          lh https://getirly.com/ site-mobile
          lh https://getirly.com/ site-desktop --preset=desktop
          lh https://getirly.com/app/ app-mobile
          REVIEW_OUT=$GITHUB_WORKSPACE/review node /tmp/pw/site-review.mjs lh || true
      - name: Capture the newest website (main, built here)
        if: env.NEXT == '1'
        run: |
          git fetch -q --depth=1 origin main
          git worktree add -q /tmp/main FETCH_HEAD
          (cd /tmp/main && git log -1 --format='%h %ci %s' > /tmp/next-commit.txt && node .github/scripts/site-build.mjs /tmp/site-next)
          (python3 -m http.server 8090 --directory /tmp/site-next > /dev/null 2>&1 &)
          sleep 2
          mkdir -p review && cp /tmp/next-commit.txt review/next-commit.txt
          REVIEW_OUT=$GITHUB_WORKSPACE/review SITE=http://localhost:8090/ ONLY_SITE=1 TAG=next- node /tmp/pw/site-review.mjs
      - name: Publish
        run: |
          B=review/getirly; [ "$LIVE" = "1" ] || B=review/getirly-next
          git config user.name irly-bot
          git config user.email bot@irly.app
          git checkout --orphan "$B"
          git rm -rfq --cached . > /dev/null
          git add review
          git commit -qm "Review captures of getirly.com"
          git push -f origin "$B"
