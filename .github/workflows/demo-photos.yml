name: Demo photos

# The app's Unsplash photos as one artifact, for the investor demo captures.

on:
  push:
    branches: [film/screens]
    paths: ['.github/scripts/demo-photos.mjs', '.github/workflows/demo-photos.yml']

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/demo-photos.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: demo-photos
          path: demo-photos
          retention-days: 7
