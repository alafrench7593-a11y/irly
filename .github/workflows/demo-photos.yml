name: Demo photos

# The app's Unsplash photos as one artifact, for the investor demo captures.

on:
  push:
    branches: [film/screens]
    paths: ['.github/scripts/demo-photos.mjs', '.github/workflows/demo-photos.yml']

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/demo-photos.mjs
      - name: Publish on an orphan branch (artifacts are not reachable from the capture sandbox)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan demo/photos
          git rm -rfq --cached . > /dev/null
          git add demo-photos
          git commit -qm "Demo photos: the app's Unsplash photos at 1600 px"
          git push -f origin demo/photos
