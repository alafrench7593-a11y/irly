name: Storage purge

# Removes the stored files of deleted accounts (and other leftovers queued in
# private.storage_cleanup) through the Supabase Storage API. Logs show counts
# per bucket only. Safe to run as often as wanted: files are claimed with a
# lease, a crashed run's files come back later, and a file is done only once
# it is really gone. Scheduled runs happen on the default branch only.
# Access, least first: SUPABASE_PURGE_KEY (this project's secret key, sb_secret_…,
# through the REST API: no Management API call). SUPABASE_ACCESS_TOKEN (the
# account-wide personal token) is only a fallback until the REST purge functions
# (migration 20261021000000) are deployed; remove it from this file afterwards.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/storage-purge.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Purge files of deleted accounts
        env:
          SUPABASE_PURGE_KEY: ${{ secrets.SUPABASE_PURGE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Which secrets this run has (never their values).
          echo "SUPABASE_PURGE_KEY: $([ -n "$SUPABASE_PURGE_KEY" ] && echo set || echo missing)"
          node scripts/storage-purge.mjs
