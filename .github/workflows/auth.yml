name: Sign-in setup

# Allows the app's redirect URLs and switches on Google / Apple sign-in on
# Supabase when their secrets exist (Settings → Secrets and variables →
# Actions): GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET,
# APPLE_SERVICES_ID, APPLE_CLIENT_SECRET. Re-run it after adding them.

on:
  push:
    branches: [main, claude/confident-ride-1o2o3x]
    paths: ['scripts/auth-config.mjs', '.github/workflows/auth.yml']
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/auth-config.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_CLIENT_SECRET: ${{ secrets.APPLE_CLIENT_SECRET }}
