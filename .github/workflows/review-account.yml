name: Review account

# Creates or refreshes the App Store review account (appreview@getirly.com)
# on the IRLY backend. Needs two repository secrets: SUPABASE_ACCESS_TOKEN
# (already there) and REVIEW_ACCOUNT_PASSWORD (14+ characters, chosen by you,
# the same one you type in App Store Connect → App Review Information).

on:
  workflow_dispatch:

jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/review-account.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REVIEW_ACCOUNT_PASSWORD: ${{ secrets.REVIEW_ACCOUNT_PASSWORD }}
