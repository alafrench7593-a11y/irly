name: Security audit

# Read-only security audit of the live Supabase project (RLS, storage,
# functions, Realtime, sign-in settings). Writes nothing, prints no secret.
# Needs SUPABASE_ACCESS_TOKEN.

# Manual runs from main only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit the live project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/security-audit.mjs
