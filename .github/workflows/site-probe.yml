name: Website probe

# Reads the live getirly.com as a search engine does: which address answers and which redirects, the status of
# the main pages, whether the host answers search crawlers, and every page of the sitemap (it answers, names
# itself as canonical, may be indexed, has its h1). It only reads. Every morning, and by hand; a problem fails
# the run, and GitHub tells the owner.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the live site
        run: node scripts/site-probe.mjs
