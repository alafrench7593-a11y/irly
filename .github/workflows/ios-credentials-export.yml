name: iOS credentials for Expo

# Makes the Apple Distribution certificate (.p12) and the App Store
# provisioning profile for app.irly.mobile with the App Store Connect key,
# and hands them over as a private download kept 1 day, to upload once in
# expo.dev → irly → Credentials → iOS (with the push key). After that, Expo
# keeps them and builds use them. The .p12 password is the
# IOS_P12_PASSWORD secret you chose; it is never written in the files.
# Note: making a new certificate revokes the older one (builds already on
# TestFlight are not affected).

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_P12_PASSWORD; do [ -n "${!v}" ] || { echo "Missing secret: $v"; exit 1; }; done
      - run: printf '%s' "${{ secrets.ASC_KEY_P8 }}" > asc-api-key.p8
      - name: Certificate and profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          node .github/scripts/ios-credentials.mjs
          mkdir -p out
          cp ios-signing/dist.p12 out/DistributionCertificate.p12
          cp ios-signing/profile.mobileprovision out/IRLY_AppStore.mobileprovision
      - uses: actions/upload-artifact@v4
        with:
          name: irly-ios-credentials
          path: out/
          retention-days: 1
