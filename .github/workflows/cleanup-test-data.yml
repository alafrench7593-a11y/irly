name: Test data clean-up

# One-off, owner-approved clean-up of test data in production (see
# scripts/cleanup-test-data.mjs). A dry run unless APPLY is '1'.
on:
  workflow_dispatch:
  push:
    branches: [claude/apple-audit]
    paths: ['scripts/cleanup-test-data.mjs', '.github/workflows/cleanup-test-data.yml']

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cleanup-test-data.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLY: '0'
