name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npx eslint src
      - name: Storage purge script (local stand-ins, no network)
        run: npm run -s test:purge
      - name: Report email script (mocked provider, no network)
        run: npm run -s test:report-email
      - name: CRM rules (statistics, duplicates, CSV)
        run: npm run -s test:crm
      - name: Crash reports carry nothing personal
        run: npm run -s test:crash
      - name: Ludo board matches the server's rules
        run: node --experimental-strip-types --no-warnings scripts/check-ludo.mts
      - name: Voice tokens (claims, signature)
        run: node --experimental-strip-types --no-warnings scripts/test-voice-token.mts
      - name: Website (titles, canonical, language versions, structured data, links, sitemap)
        run: node scripts/test-site.mjs
      - name: Native fingerprint (over-the-air updates still reach the installed apps)
        run: node scripts/check-fingerprint.mjs
      - name: Web build
        run: npx expo export --platform web
